[package]
name = "airlift_ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI shim for the iOS airlift exploit — RPPairing host + AirTraffic tunnel exploit"

[lib]
name = "airlift_ffi"
crate-type = ["staticlib"]

[dependencies]
# idevice: RPPairing host, loopback RSD tunnel, streaming_zip_conduit, AFC.
# Pinned to the same revision as SideInstaller for a known-good implementation.
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", default-features = false, features = [
  "aws-lc",
  "remote_pairing",
  "tunnel_tcp_stack",
  "rsd",
  "tcp",
  "xpc",
  "core_device_proxy",
  "afc",
  "pair",
  "usbmuxd",
  "syslog_relay",
  "installation_proxy",
] }

# idevice-ffi for tunnel_create_rppairing + AFC C FFI (re-exports its #[no_mangle] symbols).
# Minimal feature set: only what `tunnel_provider` and the always-compiled
# `provider` module need. This avoids pulling `full`, which would enable
# tss/tunneld/mobileactivationd and drag in reqwest/hyper (an unused HTTP client
# with Apple signing endpoints). `default-features = false` is required because
# the crate's default feature set is ["full", "aws-lc"].
idevice-ffi = { path = "vendor/idevice-ffi", default-features = false, features = [
  "aws-lc",
  "usbmuxd",          # provider.rs imports crate::usbmuxd unconditionally
  "tcp",              # TcpProvider
  "tunnel_tcp_stack", # tunnel_provider / adapter / tcp_object_stack
  "core_device_proxy",# AdapterHandle used by tunnel_provider
  "remote_pairing",   # rp_pairing_file
  "xpc",              # rsd module (RsdHandshakeHandle)
  "rsd",              # idevice/rsd
] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

# Apply the same OPACK back-reference patch as SideInstaller:
# devices emit tag 0xAB when name==model, which causes "unsupported OPACK tag".
[patch."https://github.com/jkcoxson/idevice.git"]
idevice = { path = "vendor/idevice" }

[profile.release]
opt-level = 3
lto = "thin"
