name: AirCard-iOS
options:
  bundleIdPrefix: io.github.hliang
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1.4"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Overridable from the command line (build-ipa.sh) so a paid developer
    # account can use its own identifiers. The extension id must remain a
    # prefix-extension of the app id.
    APP_BUNDLE_ID: io.github.hliang.aircard
    TUNNEL_BUNDLE_ID: io.github.hliang.aircard.TunnelProv

targets:
  # Embedded loopback packet tunnel (ported from LocalDevVPN) so the app no
  # longer needs an external LocalDevVPN / WireGuard install.
  TunnelProv:
    type: app-extension
    platform: iOS
    sources:
      - path: TunnelProv
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: "TunnelProv"
        PRODUCT_BUNDLE_IDENTIFIER: "$(TUNNEL_BUNDLE_ID)"
        INFOPLIST_FILE: TunnelProv/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelProv/TunnelProv.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  AirCard-iOS:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
      - target: TunnelProv
        embed: true
    settings:
      base:
        PRODUCT_NAME: "AirCard-iOS"
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        INFOPLIST_FILE: ios-app/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios-app/AirCard-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only. Must be set at target level so XcodeGen's iOS preset
        # (which defaults to "1,2") does not override it.
        TARGETED_DEVICE_FAMILY: "1"
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
